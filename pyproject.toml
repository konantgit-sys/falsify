[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falsify"
version = "0.1.0"
description = "Verify a signed record log, and verify the verifier: mutants a good check must fail."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anton Konovalov (konantgit-sys)" }]
keywords = ["verification", "ed25519", "jcs", "rfc8785", "audit-log", "mutants"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=41"]

[project.scripts]
falsify = "falsify.cli:main"

[tool.setuptools]
packages = ["falsify"]
